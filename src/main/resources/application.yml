spring:
  application:
    name: facturador-sri-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Guayaquil
  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  port: ${APP_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

facturador:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  seguridad:
    admin-username: ${ADMIN_USERNAME}
    admin-password: ${ADMIN_PASSWORD}
    login-max-intentos: ${LOGIN_MAX_INTENTOS:5}
    login-bloqueo-minutos: ${LOGIN_BLOQUEO_MINUTOS:15}
  sri:
    modo: ${SRI_MODO:SIMULADO}
    ambiente: ${SRI_AMBIENTE:1}
    recepcion-url: ${SRI_RECEPCION_URL:http://localhost:8089/comprobantes-electronicos-ws/RecepcionComprobantesOffline}
    autorizacion-url: ${SRI_AUTORIZACION_URL:http://localhost:8089/comprobantes-electronicos-ws/AutorizacionComprobantesOffline}
    certificado-p12-path: ${SRI_CERTIFICADO_P12_PATH:}
    certificado-p12-password: ${SRI_CERTIFICADO_P12_PASSWORD:}
    version-ficha-tecnica: "2.34"
    reintentos:
      max-intentos: ${SRI_REINTENTOS_MAX:5}
      backoff-base-segundos: ${SRI_REINTENTOS_BACKOFF_SEGUNDOS:30}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
