<div class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80">
  @for (n of notifications.notificaciones(); track n.id) {
    <div
      class="rounded-lg shadow-lg px-4 py-3 text-sm text-white flex items-start justify-between gap-3 animate-[fadein_0.15s_ease-out]"
      [class.bg-emerald-600]="n.tipo === 'exito'"
      [class.bg-red-600]="n.tipo === 'error'"
      [class.bg-brand-600]="n.tipo === 'info'"
    >
      <span>{{ n.mensaje }}</span>
      <button (click)="notifications.descartar(n.id)" class="opacity-80 hover:opacity-100 leading-none">✕</button>
    </div>
  }
</div>
