<div class="min-h-screen flex items-center justify-center bg-brand-900 px-4">
  <div class="w-full max-w-sm bg-white rounded-xl shadow-xl p-8">
    <h1 class="text-2xl font-semibold text-brand-700 mb-1">Facturador SRI</h1>
    <p class="text-sm text-slate-500 mb-6">POS, inventario y facturación electrónica</p>

    <form (ngSubmit)="ingresar()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="username">Usuario</label>
        <input
          id="username"
          name="username"
          type="text"
          required
          [(ngModel)]="username"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          [(ngModel)]="password"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400"
        />
      </div>

      @if (error()) {
        <p class="text-sm text-red-600">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="cargando()"
        class="w-full rounded-md bg-brand-600 hover:bg-brand-700 disabled:opacity-50 text-white text-sm font-medium py-2.5 transition-colors"
      >
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
